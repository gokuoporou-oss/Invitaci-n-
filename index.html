<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitación Especial</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="contenedor">

        <!-- SOBRE -->
        <div class="sobre" id="sobre">
            <div class="tapa"></div>
            <div class="carta">
                <span>💌</span>
                <h2>¡Estás invitado!</h2>
                <p>Toca el sobre para abrir</p>
            </div>
        </div>

        <!-- INVITACIÓN -->
        <div class="invitacion" id="invitacion">

            <p class="pequeno">✨ UNA INVITACIÓN ESPECIAL ✨</p>

            <h1>Fiesta de<br><span>Cumpleaños</span></h1>

            <div class="linea"></div>

            <p class="nombre">Carlos</p>

            <p class="texto">
                Me encantaría compartir contigo
                un momento muy especial.
                ¡Espero verte ahí!
            </p>

            <div class="datos">
                <div>
                    <strong>📅 FECHA</strong>
                    <p>25 de Octubre, 2026</p>
                </div>

                <div>
                    <strong>🕐 HORA</strong>
                    <p>20:00 hs</p>
                </div>

                <div>
                    <strong>📍 LUGAR</strong>
                    <p>Salón Los Jardines</p>
                </div>
            </div>

            <button onclick="confirmar()">
                Confirmar asistencia 💌
            </button>

            <p class="final">¡Te espero! ❤️</p>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
